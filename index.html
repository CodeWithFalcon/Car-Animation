<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Animation</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="scene">

  <!-- Sky -->
  <div class="sky"></div>

  <!-- Trees -->
  <div class="trees"></div>

  <!-- Road -->
  <div class="road"></div>

  <!-- Car -->
  <div class="car">
    <img src="accets/car_body.png" class="car-body" alt="car">

    <img src="accets/car_wheel_left.png" class="wheel left" alt="wheel">
    <img src="accets/car_wheel_right.png" class="wheel right" alt="wheel">
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
